name: CI CD RustFS Web Lab

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "k8s/**"

permissions:
  contents: write
  packages: write

jobs:
  build-and-update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rustfs-web-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rustfs-web-app:latest

      - name: Update Image Tag in k8s Manifest
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          sed -i "s|image: ghcr.io/${OWNER}/rustfs-web-app:.*|image: ghcr.io/${OWNER}/rustfs-web-app:${SHA}|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || (git commit -m "chore(k8s): update image tag to ${SHA}" && git push origin main)
